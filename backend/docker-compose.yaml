# Compose reads `.env` in this directory for variable substitution (no --env-file needed).

# docker compose up -d

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    restart: unless-stopped

  postgres-test:
    image: postgres:latest
    container_name: postgres-test
    environment:
      POSTGRES_DB: ${DB_TEST_NAME}
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
    volumes:
      - postgres_test_data:/var/lib/postgresql
    ports:
      - "${DB_TEST_PORT}:5432"
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:


